<!DOCTYPE html>
<html>
<head>
  <!-- Questo blocco <style> è il CSS: definisce i colori e le misure -->
  <style>
    /* Regole generali per tutta la pagina */
    body { margin: 0; font-family: sans-serif; background-color: #fafafa; }
    
    /* Regole per la barra blu */
    .navbar { 
      background-color: #0055a4; /* Il blu marino */
      padding: 15px 30px;        /* Lo spessore della barra */
      text-align: right;         /* Spinge i link verso destra */
      position: sticky;  /* Rende la barra appiccicosa */
      top: 0;            /* Le dice di incollarsi esattamente al margine alto (zero) */
      z-index: 1000;     /* È la "profondità". Un numero alto assicura che la barra stia SEMPRE sopra il testo che scorre sotto */
    }
    /* Regole per i link dentro la barra */
    .navbar a { 
      color: white; 
      text-decoration: none;     /* Toglie la sottolineatura ai link */
      margin-left: 20px;         /* Spazio tra un link e l'altro */
      font-weight: bold; 
    }
    
    /* Regole per l'area del testo in basso */
    .content { 
      max-width: 1250px;  
      margin: 40px auto; 
      padding: 0 40px;    
      text-align: left;   /* 1. Spinge TUTTO a sinistra di default */
    }

    .content h1 {
      text-align: center; /* 2. Prende solo il titolo grande e lo riporta al centro */
      margin-bottom: 40px; /* (Opzionale) dà un po' di respiro sotto al titolo */
    }
  </style>
</head>
<body>
  <!-- Questo <div> è letteralmente il rettangolo della barra in alto -->
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="research.html">Research</a>
    <a href="teaching.html">Teaching</a>
  </div>

  <!-- INIZIO DELLA NUOVA AGGIUNTA: IL NOME GIGANTE DINAMICO -->
  <div style="text-align: center; margin-bottom: 50px; padding: 40px 20px;">
    <!-- Qui Jekyll inserirà il titolo e il sottotitolo leggendoli dai tuoi file Markdown -->
    <h1 style="color: #0055a4; font-size: 3em; margin: 0;">{{ page.title }}</h1>
    {% if page.subtitle %}
      <h2 style="color: #555; font-weight: normal; margin-top: 10px;">{{ page.subtitle }}</h2>
    {% endif %}
  </div>
  <!-- FINE DELLA NUOVA AGGIUNTA -->

  <!-- Questo <div> è il rettangolo invisibile che contiene i tuoi testi -->
  <div class="content">
    <!-- Questo è il "buco magico". Qui GitHub inietterà il tuo Markdown -->
    {{ content }}
  </div>
</body>
</html>
