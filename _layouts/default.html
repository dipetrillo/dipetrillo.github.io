<!DOCTYPE html>
<html>
<head>
  <style>
    /* 1. REGOLE GENERALI (Nuovo font morbido e colori riposanti) */
    body { 
      margin: 0; 
      background-color: #fdfdfd; /* Bianco leggermente caldo, non accecante */
      color: #333333; /* Grigio antracite, molto meno severo del nero */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7; /* Respiro tra le righe */
      font-size: 17px; 
    }
    
    /* 2. REGOLE DELLA BARRA (Intatte, ma con piccolo effetto hover) */
    .navbar { 
      background-color: #0055a4; 
      padding: 15px 30px;        
      text-align: right;         
      position: sticky;  
      top: 0;            
      z-index: 1000;     
    }
    .navbar a { 
      color: white; 
      text-decoration: none;     
      margin-left: 20px;         
      font-weight: bold; 
    }
    .navbar a:hover {
      text-decoration: underline; /* Sottolinea i link della barra quando ci passi sopra */
    }

    /* 3. REGOLE TITOLI GENERALI */
    h1, h2, h3 {
      color: #1a1a1a; 
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    /* 4. REGOLE DEL TESTO (La gabbia per Home, Teaching, ecc.) */
    .content { 
      max-width: 1250px;  
      margin: 40px auto; 
      padding: 0 40px;    
      text-align: left;   
    }
    .content h1 {
      text-align: center; 
      margin-bottom: 40px; 
    }

    /* 5. REGOLE LINK NEL TESTO (CV, tesi, ecc. - Look elegante) */
    .content a {
      color: #2c5282; /* Blu polvere, sobrio e accademico */
      text-decoration: none; 
      border-bottom: 1px solid transparent; 
      transition: all 0.2s ease;
    }
    .content a:hover {
      border-bottom: 1px solid #2c5282; 
    }
  </style>
</head>
<body>
  <!-- La barra di navigazione -->
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="research.html">Research</a>
    <a href="teaching.html">Teaching</a>
  </div>

  <!-- Il tuo titolo dinamico (Ora userà il nuovo font) -->
  <div style="text-align: center; margin-bottom: 50px; padding: 40px 20px;">
    <h1 style="color: #0055a4; font-size: 3em; margin: 0;">{{ page.title }}</h1>
    {% if page.subtitle %}
      <h2 style="color: #555; font-weight: normal; margin-top: 10px;">{{ page.subtitle }}</h2>
    {% endif %}
  </div>

  <!-- L'area dei contenuti -->
  <div class="content">
    {{ content }}
  </div>
</body>
</html>
